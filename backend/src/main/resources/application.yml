server:
  port: 8080

spring:
  application:
    name: metrics-dashboard
  
  datasource:
    url: jdbc:postgresql://localhost:5432/metricsdb
    driver-class-name: org.postgresql.Driver
    username: metricsuser
    password: metricspass
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      jdbc:
        batch_size: 1000
        order_inserts: true
        order_updates: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 1000
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: localhost
    port: 1025
    username: 
    password: 
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    com.metrics.dashboard: DEBUG
    org.springframework.web: DEBUG
